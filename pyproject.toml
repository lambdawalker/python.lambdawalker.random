[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-random"
version = "0.1.0"
description = "Random selection and value generation utilities for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.random"
Repository = "https://github.com/lambdawalker/python.lambdawalker.random"
Issues = "https://github.com/lambdawalker/python.lambdawalker.random/issues"

[tool.uv.build-backend]
module-name = "lambdawalker.random"
namespace = true
